name: Archive market news
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: marketscope-market-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect and merge news archive
        env:
          MARKETSCOPE_GITHUB_TOKEN: ${{ github.token }}
          MARKETSCOPE_GITHUB_REPO: ${{ github.repository }}
          MARKETSCOPE_GITHUB_BRANCH: ${{ github.ref_name }}
        run: python scripts/update_market_news.py
