[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#07111f"
secondaryBackgroundColor = "#0f1b2d"
textColor = "#f8fafc"
font = "sans serif"

[server]
enableStaticServing = true
headless = true
runOnSave = false
fileWatcherType = "none"
disconnectedSessionTTL = 1800
websocketPingInterval = 30
