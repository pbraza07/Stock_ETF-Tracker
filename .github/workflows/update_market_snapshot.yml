name: Refresh MarketScope universe, snapshot and actual monthly rankings (v5.9.47)
# Preserves the validated max-history refresh contract introduced in (v5.9.5).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/default_universe.csv'
      - 'data/market_snapshot.csv'
      - 'data/snapshot_metadata.json'
      - 'data/universe_metadata.json'
      - 'data/saved_portfolio_simulations.json'
      - 'data/generated_pdfs/**'
      - 'static/generated_pdfs/**'
      - 'data/monthly_returns_10y.csv'
      - 'data/top100_rebalanced_monthly_withdrawal_10y_no_hwm.csv'
      - 'data/top100_not_rebalanced_monthly_withdrawal_10y_no_hwm.csv'
  schedule:
    - cron: '0 18 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: marketscope-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Nasdaq >$100B universe and analyst ratings
        run: python scripts/update_universe.py

      - name: Build daily returns, buy signals and analyst price-target snapshot
        env:
          MARKETSCOPE_HISTORY_PERIOD: max
          MARKETSCOPE_BATCH_SIZE: 80
          MARKETSCOPE_BATCH_PAUSE: 0.35
        run: python scripts/update_snapshot.py

      - name: Build actual 10Y monthly withdrawal rankings
        run: python scripts/build_actual_monthly_rankings.py

      - name: Commit refreshed persistent data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default_universe.csv data/market_snapshot.csv data/snapshot_metadata.json data/universe_metadata.json data/monthly_returns_10y.csv data/top100_rebalanced_monthly_withdrawal_10y_no_hwm.csv data/top100_not_rebalanced_monthly_withdrawal_10y_no_hwm.csv
          if git diff --cached --quiet; then
            echo "No universe/snapshot changes to commit."
          else
            git commit -m "chore: refresh MarketScope 6PM ET snapshot"
            git push
          fi
