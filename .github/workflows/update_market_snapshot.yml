name: Refresh MarketScope universe, snapshot and actual monthly rankings (v5.9.55)
# Automatic daily refresh now owns the full 25 completed-year adjusted-history window.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/default_universe.csv'
      - 'data/market_snapshot.csv'
      - 'data/snapshot_metadata.json'
      - 'data/universe_metadata.json'
      - 'data/saved_portfolio_simulations.json'
      - 'data/generated_pdfs/**'
      - 'static/generated_pdfs/**'
      - 'data/monthly_returns_10y.csv'
      - 'data/top100_rebalanced_monthly_withdrawal_10y_no_hwm.csv'
      - 'data/top100_not_rebalanced_monthly_withdrawal_10y_no_hwm.csv'
      - 'data/top100_recession_balanced_rebalanced_10y.csv'
      - 'data/top100_recession_balanced_not_rebalanced_10y.csv'
  schedule:
    - cron: '0 18 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: marketscope-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Nasdaq >$100B universe and analyst ratings
        run: python scripts/update_universe.py

      - name: Build automatic 25Y returns, buy signals and analyst price-target snapshot
        env:
          MARKETSCOPE_ANNUAL_HISTORY_START: 2000-01-01
          MARKETSCOPE_BATCH_SIZE: 80
          MARKETSCOPE_BATCH_PAUSE: 0.35
        run: python scripts/update_snapshot.py

      - name: Audit automatic 25Y annual-return coverage (2025-2001)
        run: python scripts/validate_25y_snapshot.py

      # v5.9.55: persist the verified 25Y snapshot immediately. Do not wait for
      # slower portfolio-ranking jobs before making 2005-2001 durable.
      - name: Persist verified 25Y market snapshot
        run: |
          scripts/persist_generated_files.sh             "chore: persist verified MarketScope 25Y snapshot"             data/default_universe.csv             data/market_snapshot.csv             data/snapshot_metadata.json             data/universe_metadata.json             data/monthly_returns_10y.csv

      - name: Build actual 10Y monthly withdrawal rankings
        run: python scripts/build_actual_monthly_rankings.py

      - name: Build recession-balanced 10Y rankings
        run: python scripts/build_recession_rankings.py

      - name: Persist refreshed ranking data
        run: |
          scripts/persist_generated_files.sh             "chore: refresh MarketScope ranking datasets"             data/top100_rebalanced_monthly_withdrawal_10y_no_hwm.csv             data/top100_not_rebalanced_monthly_withdrawal_10y_no_hwm.csv             data/top100_recession_balanced_rebalanced_10y.csv             data/top100_recession_balanced_not_rebalanced_10y.csv
