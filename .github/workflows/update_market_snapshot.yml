name: Refresh MarketScope universe and snapshot (v5.8.1)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/default_universe.csv'
      - 'data/market_snapshot.csv'
      - 'data/snapshot_metadata.json'
  schedule:
    - cron: '0 18 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: marketscope-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Nasdaq >$100B universe and analyst ratings
        run: python scripts/update_universe.py

      - name: Build daily calendar-year returns and buy-signal snapshot
        env:
          MARKETSCOPE_HISTORY_PERIOD: max
          MARKETSCOPE_BATCH_SIZE: 80
          MARKETSCOPE_BATCH_PAUSE: 0.35
        run: python scripts/update_snapshot.py

      - name: Commit refreshed persistent data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default_universe.csv data/market_snapshot.csv data/snapshot_metadata.json
          if git diff --cached --quiet; then
            echo "No universe/snapshot changes to commit."
          else
            git commit -m "chore: refresh MarketScope 6PM ET snapshot"
            git push
          fi
