services:
  - type: web
    name: marketscope-stock-etf-tracker
    runtime: python
    plan: free
    region: virginia
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: MARKETSCOPE_GITHUB_REPO
        value: pbraza07/Stock_ETF-Tracker
      - key: MARKETSCOPE_GITHUB_BRANCH
        value: main
      - key: MARKETSCOPE_GITHUB_TOKEN
        sync: false
