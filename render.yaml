services:
  - type: web
    name: marketscope-stock-etf-tracker
    runtime: python
    plan: free
    region: virginia
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt && python scripts/update_snapshot.py
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: PYTHONUNBUFFERED
        value: '1'
