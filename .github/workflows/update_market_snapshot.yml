name: Refresh MarketScope universe and snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/default_universe.csv'
      - 'data/market_snapshot.csv'
  schedule:
    # 23:15 UTC is after the regular U.S. market close year-round.
    - cron: '15 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: marketscope-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh $100M+ stock universe and ETF allowlist
        run: python scripts/update_universe.py

      - name: Build adjusted-total-return market snapshot
        env:
          MARKETSCOPE_HISTORY_PERIOD: 10y
          MARKETSCOPE_BATCH_SIZE: 80
          MARKETSCOPE_BATCH_PAUSE: 0.35
        run: python scripts/update_snapshot.py

      - name: Commit refreshed universe and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default_universe.csv data/market_snapshot.csv
          if git diff --cached --quiet; then
            echo "No universe/snapshot changes to commit."
          else
            git commit -m "chore: refresh MarketScope universe and snapshot"
            git push
          fi
